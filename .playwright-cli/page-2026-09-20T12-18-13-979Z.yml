    - paragraph [ref=e86]:
      - strong [ref=e87]: 总体结论：
      - text: 本次 5 项自动质量 FAIL 没有证据表明由 NPU 负载过高导致。其中 2 项主要是输出额度不足，1 项同时包含额度不足和模型指令遵循问题，1 项是模型主动提前结束，另 1 项（repeat）属于自动校验误报，不应计作模型性能失败。
    - paragraph [ref=e88]:
      - strong [ref=e89]: 硬件证据边界：
      - text: 本次共 91 个实际请求，HTTP 错误/超时为 0；失败请求生成速度约为 20.6-21.8 token/s，未出现明显异常掉速。现有 npu_monitor.log 只记录到 20:37:53，而这些失败请求完成于 20:43:23-21:06:31，因此不能用该日志证明失败时 NPU 过载。日志覆盖时段内设备健康状态为 OK，AI Core 约 39%-42%。
    - paragraph [ref=e90]:
      - strong [ref=e91]: 归因标签：
      - text: CONFIG_LIMIT＝请求或服务端配置限制；MODEL_BEHAVIOR＝模型主动结束或未遵循指令；VALIDATOR_ERROR＝自动校验规则与测试目标不一致。
